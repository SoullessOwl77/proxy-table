<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to Play — Proxy Table 40K</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<script src="./guide-data.js"></script>
<style>
:root{
  --felt:#141d1b; --felt-2:#1b2825; --felt-3:#233330; --ink:#0a0f0e;
  --brass:#c39a4e; --brass-dim:#7d6433;
  --parchment:#e9e3d4; --parchment-dim:#8e9490; --blood:#a8443c; --good:#6bbf8a;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--parchment);
  font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%;}
body{background:radial-gradient(120% 90% at 50% 0%,var(--felt-2) 0%,var(--felt) 55%,var(--ink) 100%);
  padding:0 max(env(safe-area-inset-left),0px) max(env(safe-area-inset-bottom),0px) max(env(safe-area-inset-right),0px);}
a{color:var(--brass);text-decoration:none;}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:#0d1413ee;border-bottom:1px solid #2a3a36;backdrop-filter:blur(6px);}
.bar h1{font-family:Fraunces,serif;font-weight:900;font-size:16px;margin:0;flex:1;line-height:1.1;}
.bar a.link{font-size:12px;border:1px solid var(--brass-dim);border-radius:7px;padding:6px 9px;color:var(--brass);white-space:nowrap;}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 96px;}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;}
.nav button{font-family:Fraunces,serif;font-size:12px;font-weight:600;letter-spacing:.02em;
  color:var(--parchment-dim);background:#16211f;border:1px solid #2a3a36;border-radius:999px;padding:6px 11px;cursor:pointer;}
.nav button.on{color:var(--ink);background:var(--brass);border-color:var(--brass);}
.card{background:#16211fcc;border:1px solid #2a3a36;border-radius:14px;padding:18px 18px 20px;box-shadow:0 6px 22px #0006;}
.kicker{font-family:Archivo;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-dim);}
.card h2{font-family:Fraunces,serif;font-weight:900;font-size:27px;margin:3px 0 8px;line-height:1.05;}
.lede{font-size:15.5px;line-height:1.5;color:var(--parchment);margin:0 0 6px;}
.sec{margin-top:18px;}
.sec h3{font-family:Fraunces,serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--brass);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid #2a3a3688;}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 6px 34px;line-height:1.45;font-size:14.5px;border-bottom:1px solid #212f2c;}
ol.steps li:last-child{border-bottom:none;}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:23px;height:23px;border-radius:50%;
  background:var(--felt-3);color:var(--brass);font-family:Fraunces,serif;font-weight:900;font-size:12px;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--brass-dim);}
ul.watch{margin:0;padding:0;list-style:none;}
ul.watch li{position:relative;padding:5px 0 5px 22px;line-height:1.45;font-size:14px;color:var(--parchment);}
ul.watch li::before{content:"!";position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:4px;
  background:#3a241866;color:var(--blood);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--blood);}
.aside-body{font-size:14.5px;line-height:1.55;}
.nextline{margin-top:18px;padding:11px 13px;background:#12201c;border:1px solid #2a3a36;border-radius:10px;
  font-size:13.5px;color:var(--parchment-dim);}
.nextline b{color:var(--good);font-weight:700;}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0d1413ee;border-top:1px solid #2a3a36;backdrop-filter:blur(6px);}
.pager .count{flex:1;text-align:center;font-size:12px;color:var(--parchment-dim);font-family:Fraunces,serif;letter-spacing:.05em;}
.pager button{font-family:Fraunces,serif;font-weight:600;font-size:14px;border-radius:9px;padding:9px 16px;cursor:pointer;
  color:var(--parchment);background:#16211f;border:1px solid #2a3a36;}
.pager button.go{color:var(--ink);background:var(--brass);border-color:var(--brass);}
.pager button:disabled{opacity:.35;cursor:default;}
.intro-list{margin:10px 0 0;padding:0;list-style:none;}
.intro-list li{padding:8px 0;border-bottom:1px solid #212f2c;font-size:14.5px;line-height:1.45;}
.intro-list li:last-child{border-bottom:none;}
.intro-list b{font-family:Fraunces,serif;color:var(--parchment);}
</style>
</head>
<body>
<div class="bar">
  <h1>How to Play · 40K proxy</h1>
  <a class="link" href="./wh40k.html">Open table</a>
  <a class="link" href="./index.html">Hub</a>
</div>
<div class="wrap">
  <div class="nav" id="nav"></div>
  <div class="card" id="card"></div>
</div>
<div class="pager">
  <button id="prev">Back</button>
  <span class="count" id="count"></span>
  <button id="next" class="go">Next</button>
</div>
<script>
(function(){
  var G = window.PT_GUIDE;
  if (!G){ document.getElementById("card").innerHTML = "<h2>Guide data didn't load</h2><p class='lede'>Reload the page — guide-data.js is required.</p>"; return; }

  var INTRO = {
    label: "Start here",
    title: "What this game is",
    lede: "Warhammer 40,000 is a tabletop game where two players each command an army of miniatures on a table. You take turns moving your models, shooting, and fighting in melee; you measure everything in inches and settle every attack by rolling six-sided dice. You score points mainly by controlling marked spots on the table called objectives, and whoever has the most points when the game ends wins. This app is a practice table for learning that flow - it does not enforce the rules for you, so this guide explains what happens in each part and what to tap. Here is the shape of a game before we walk through it.",
    items: [
      ["Model vs unit", "A model is one miniature. A unit is a group of models that moves and fights together, and most rules apply to the whole unit at once."],
      ["Before the battle", "Both players pick an army, set up terrain, and take turns placing their units on their own half of the table. Then you roll a die to see who takes the first turn."],
      ["Command", "The start of your turn. You collect a Command Point (a resource for special moves) and check whether any battered units panic."],
      ["Movement", "Move your units across the table, measured in inches - toward objectives or into good firing positions."],
      ["Shooting", "Units with ranged weapons shoot at enemy units they can see and reach."],
      ["Charge", "Roll dice to rush a unit into contact with an enemy so it can fight in melee."],
      ["Fight", "Units in close range swing at each other. Then your turn ends and you score the objectives you hold."]
    ],
    next: "A game runs a set number of rounds, and both players take a full turn each round. Tap Next to start with setting up your first game."
  };

  var order = (G.order || ["setup","command","movement","shooting","charge","fight"]);
  var asideKeys = ["reactions","command_points","scoring"];

  var pages = [];
  pages.push({kind:"intro"});
  order.forEach(function(k){ if (G.phases && G.phases[k]) pages.push({kind:"phase", key:k}); });
  asideKeys.forEach(function(k){ if (G.asides && G.asides[k]) pages.push({kind:"aside", key:k}); });

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function navLabel(pg){
    if (pg.kind === "intro") return "Overview";
    if (pg.kind === "phase") return G.phases[pg.key].title;
    return G.asides[pg.key].title;
  }

  function renderNav(idx){
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    pages.forEach(function(pg, i){
      var b = document.createElement("button");
      b.textContent = navLabel(pg);
      if (i === idx) b.className = "on";
      b.onclick = function(){ go(i); };
      nav.appendChild(b);
    });
  }

  function phaseHtml(key){
    var p = G.phases[key], t = p.tutorial || {};
    var h = '<div class="kicker">Phase</div><h2>' + esc(p.title) + '</h2>';
    if (t.whatFor) h += '<p class="lede">' + esc(t.whatFor) + '</p>';
    if (t.yourMove && t.yourMove.length){
      h += '<div class="sec"><h3>What you do</h3><ol class="steps">';
      t.yourMove.forEach(function(s){ h += '<li>' + esc(s) + '</li>'; });
      h += '</ol></div>';
    }
    if (t.watchOuts && t.watchOuts.length){
      h += '<div class="sec"><h3>Watch out for</h3><ul class="watch">';
      t.watchOuts.forEach(function(s){ h += '<li>' + esc(s) + '</li>'; });
      h += '</ul></div>';
    }
    if (t.whatsNext) h += '<div class="nextline">Next: <b>' + esc(t.whatsNext) + '</b></div>';
    return h;
  }

  function asideHtml(key){
    var a = G.asides[key];
    return '<div class="kicker">Good to know</div><h2>' + esc(a.title) + '</h2><p class="aside-body">' + esc(a.body) + '</p>';
  }

  function introHtml(){
    var h = '<div class="kicker">' + esc(INTRO.label) + '</div><h2>' + esc(INTRO.title) + '</h2><p class="lede">' + esc(INTRO.lede) + '</p><ul class="intro-list">';
    INTRO.items.forEach(function(row){ h += '<li><b>' + esc(row[0]) + '</b> — ' + esc(row[1]) + '</li>'; });
    h += '</ul><div class="nextline">' + esc(INTRO.next) + '</div>';
    return h;
  }

  var cur = 0;
  function render(){
    var pg = pages[cur];
    var card = document.getElementById("card");
    if (pg.kind === "intro") card.innerHTML = introHtml();
    else if (pg.kind === "phase") card.innerHTML = phaseHtml(pg.key);
    else card.innerHTML = asideHtml(pg.key);
    document.getElementById("count").textContent = (cur+1) + " of " + pages.length;
    document.getElementById("prev").disabled = (cur === 0);
    var nx = document.getElementById("next");
    nx.textContent = (cur === pages.length-1) ? "Try it on the table" : "Next";
    renderNav(cur);
    var key = pg.kind === "intro" ? "overview" : pg.key;
    if (history.replaceState) history.replaceState(null, "", "#" + key);
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0) i = 0;
    if (i > pages.length-1){ location.href = "./wh40k.html?tour=1"; return; }
    cur = i; render();
  }

  document.getElementById("prev").onclick = function(){ go(cur-1); };
  document.getElementById("next").onclick = function(){ go(cur+1); };
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") go(cur+1);
    else if (e.key === "ArrowLeft") go(cur-1);
  });

  // Deep-link via hash
  var hash = (location.hash || "").replace("#","");
  if (hash){
    var hit = pages.findIndex(function(pg){
      var key = pg.kind === "intro" ? "overview" : pg.key;
      return key === hash;
    });
    if (hit >= 0) cur = hit;
  }
  render();
})();
</script>
</body>
</html>
